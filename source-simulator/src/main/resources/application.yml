server:
  port: 7081

spring:
  application:
    name: onefinux-source-simulator

sim:
  hub-url: http://localhost:7070
  zone: America/New_York
  allowed-origins:
    - http://localhost:7091
    - http://127.0.0.1:7091
    - http://localhost:8080
    - http://127.0.0.1:8080
  allowed-origin-patterns:
    - http://192.168.*:7091
    - http://10.*:7091
    - http://172.*:7091
    - http://169.254.*:7091
    - http://192.168.*:8080
    - http://10.*:8080
    - http://172.*:8080
    - http://169.254.*:8080
  downstream-seconds: 6
