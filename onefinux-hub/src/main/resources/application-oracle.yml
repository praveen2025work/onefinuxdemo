# Production persistence profile: Oracle 19c.
#   run with: --spring.profiles.active=oracle  (plus the env vars below)
#
# The POC runs on H2 (default profile) with the Flyway baseline in db/migration. For Oracle, keep the
# schema in a vendor-specific migration set (VARCHAR2 / TIMESTAMP / sequences instead of H2 IDENTITY and
# MERGE ... KEY) under db/migration/oracle and point Flyway at it. Add the driver + Flyway Oracle module
# to the build for this profile:
#     runtimeOnly 'com.oracle.database.jdbc:ojdbc11'
#     runtimeOnly 'org.flywaydb:flyway-database-oracle'
spring:
  datasource:
    url: ${ORACLE_JDBC_URL:jdbc:oracle:thin:@//db:1521/ONEFINUX}
    username: ${ORACLE_USER:onefinux}
    password: ${ORACLE_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
  flyway:
    enabled: true
    # {vendor} resolves to 'oracle' here; the H2 default profile keeps using db/migration.
    locations: classpath:db/migration/oracle
    baseline-on-migrate: true
    baseline-version: 0
  h2:
    console:
      enabled: false
