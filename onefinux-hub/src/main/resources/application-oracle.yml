# Production persistence profile: Oracle 19c.
#   build with:  mvn -B -Poracle package        (adds ojdbc11 and flyway-database-oracle)
#   run with:    --spring.profiles.active=oracle  (plus the env vars below)
#
# The POC runs on H2 (default profile) with the Flyway set in db/migration. db/oracle mirrors it
# version for version (VARCHAR2, NUMBER(1) booleans, CLOB over 4000 bytes, plain INSERT seeds); add every new
# migration to both. Runtime SQL is written to run on both stores (see PortableSql).
spring:
  datasource:
    url: ${ORACLE_JDBC_URL:jdbc:oracle:thin:@//db:1521/ONEFINUX}
    username: ${ORACLE_USER:onefinux}
    password: ${ORACLE_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
  flyway:
    enabled: true
    # Not under db/migration: Flyway scans a location recursively, and the H2 profile uses db/migration.
    locations: classpath:db/oracle
    baseline-on-migrate: true
    baseline-version: 0
  h2:
    console:
      enabled: false
