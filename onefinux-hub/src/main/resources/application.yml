server:
  port: 7070

spring:
  application:
    name: onefinux-hub
  datasource:
    # File-based so a restart demonstrates state rebuild by event replay. Production: Oracle 19c.
    url: jdbc:h2:file:./data/onefinux-hub
    username: sa
    password: ""
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate must not create or alter tables; it only maps onto them.
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Adopt a pre-existing POC database cleanly; on a fresh database the baseline is a no-op and V1 runs.
    baseline-on-migrate: true
    baseline-version: 0
  h2:
    console:
      enabled: true
  mvc:
    problemdetails:
      enabled: true     # RFC 7807 errors that tell a producer exactly what is wrong

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,scheduledtasks
  endpoint:
    health:
      probes:
        enabled: true       # /actuator/health/liveness + /readiness for k8s
      show-details: when_authorized
  metrics:
    tags:
      application: onefinux-hub    # every meter carries the app tag for multi-service dashboards
  observations:
    key-values:
      application: onefinux-hub

logging:
  level:
    notification.email: INFO
    com.onefinux: INFO

onefinux:
  zone: America/New_York
  public-url: http://localhost:7070
  simulator-url: http://localhost:7081

  # JSON drops (feed-event-v1 or inbound-event-v1) land here and share EventHubService.ingest with POST /api/events.
  feed-watch:
    enabled: true
    inbox: data/feeds/inbox
    processed: data/feeds/processed
    rejected: data/feeds/rejected
    interval-ms: 1000

  # Exact localhost plus RFC1918 WiFi/Ethernet IPv4 on the console ports only.
  # Never a star origin and never any-port localhost.
  cors:
    allowed-origins:
      - http://localhost:7091
      - http://127.0.0.1:7091
      - http://localhost:8080
      - http://127.0.0.1:8080
    allowed-origin-patterns:
      - http://192.168.*:7091
      - http://10.*:7091
      - http://172.*:7091
      - http://169.254.*:7091
      - http://192.168.*:8080
      - http://10.*:8080
      - http://172.*:8080
      - http://169.254.*:8080

  # ---------------------------------------------------------------- Identity + entitlement (CEES)
  # POC: symmetric JWT so the hub can mint dev tokens and validate them without an IdP. Production:
  # set spring.security.oauth2.resourceserver.jwt.issuer-uri to the bank IdP, source entitlements from
  # CEES, and set dev-default-user=false so unauthenticated access is denied (fail-closed).
  security:
    jwt-secret: ${ONEFINUX_JWT_SECRET:onefinux-dev-signing-secret-please-override-in-prod-0123456789}
    dev-default-user: ${ONEFINUX_DEV_DEFAULT_USER:true}   # no token => act as default-user (keeps console/simulator working)
    dev-tokens: ${ONEFINUX_DEV_TOKENS:true}               # demo identities in the profile menu; false in production
    default-user: praveen.kumar
    token-ttl-minutes: 480
    # Single sign-on (OpenID Connect). Set the issuer and client id to have the console sign users in at the bank
    # IdP (authorization code + PKCE) and the hub validate that issuer's tokens. Claim names map the IdP's token.
    oidc:
      issuer: ${ONEFINUX_OIDC_ISSUER:}
      client-id: ${ONEFINUX_OIDC_CLIENT_ID:}
      scope: openid profile email
      audience: ${ONEFINUX_OIDC_AUDIENCE:}
      roles-claim: roles
      group-units-claim: groupUnits
    require-mfa: ${ONEFINUX_REQUIRE_MFA:false}   # SSO tokens must show a second factor (amr claim)
    idle-lock-minutes: 15            # the console locks after this long without input
    inactivity-days: 90              # access is suspended after this long without a visit
    # Role structure: the verbs each role may perform. Roles outside this list are ignored, superuser needs ADMIN,
    # and a role change in the IdP changes what the user can do on their next request.
    role-actions:
      ADMIN: [SIGN_OFF, COUNTERSIGN, POST, AMEND, ADJUST, ESCALATE, REPLAY, WRITEBACK, WRITEBACK_APPROVE, ACCESS_APPROVE, ACCESS_REVIEW]
      CONTROLLER: [SIGN_OFF, POST, AMEND, ADJUST, ESCALATE, WRITEBACK]
      GLA: [COUNTERSIGN, ESCALATE, WRITEBACK_APPROVE]
      RTB: [REPLAY, ESCALATE]
      AUDIT: [ACCESS_REVIEW]
    users:
      # Bracket-quoted keys so dotted usernames bind as literal map keys (not nested paths).
      "[praveen.kumar]": { superuser: true, roles: [ADMIN] }
      "[alice.revacc]":  { roles: [CONTROLLER], groupUnits: [REV-ACC], ceesProducts: ["product:FOBO"] }
      "[gla.reviewer]":  { roles: [GLA], groupUnits: [REV-ACC], ceesProducts: ["product:FOBO"] }
      "[bob.markets]":   { roles: [CONTROLLER], groupUnits: [MARKETS] }   # entitled to a unit with no instances
      "[auditor]":       { roles: [AUDIT], groupUnits: [REV-ACC] }

  # ---------------------------------------------------------------- One UX platform
  ux:
    retention-days: 180
    # Other applications' search, included in the header search. GET url?q= returns {hits:[{kind,id,title,detail,route}]}.
    search-providers:
      - { id: breaks, label: "Break register (partner)", url: /sim/search }
    # A chatbot another team runs, framed in the assistant panel and as a desk widget. It links /theme/onefinux-tokens.css
    # and uses the .ofx-chat classes, so it looks like the console. Set url to the bot (https://chat.bank.local/…) and
    # origin to its origin; the console accepts messages only from that origin. The demo bot ships with the console.
    chatbot:
      url: ${ONEFINUX_CHATBOT_URL:/chatbot-demo.html}
      title: ${ONEFINUX_CHATBOT_TITLE:Chat (demo)}
      origin: ${ONEFINUX_CHATBOT_ORIGIN:}
    # A-B experiments: each user always sees the same variant; conversion names the component-use event that counts.
    experiments:
      - id: home-team-picks
        description: Show "Popular with your team" on Home
        variants: [hidden, shown]
        weights: [1, 1]
        enabled: true
        conversion: recommendation.open

  # In-app assistant: answers from the hub's facts for the user; advisory, never on the readiness path. It calls
  # Claude only when both are set: ONEFINUX_ASSIST_MODEL (a Claude model id) and ANTHROPIC_API_KEY.
  assist:
    model: ${ONEFINUX_ASSIST_MODEL:}
    api-key: ${ANTHROPIC_API_KEY:}
    effort: low
    fallbacks: true

  # Grid write-back: approved edits are applied by calling the owning system. Only targets listed here can be called.
  writeback:
    targets:
      breaks: { url: "http://localhost:7081/sim/grids/breaks/apply" }

  # ---------------------------------------------------------------- Component 2: translation layer
  translation:
    source-identifiers:
      MOTIF: MASTER_BOOK
      SAP: COST_CENTRE
      GMIS: BOOK_ID
      RAMP: CHORUS_GROUP
      USCASTLE: PROCESSING_BATCH
      FINSTORE: FEED
      AXIOM: REPORT_SCHEDULE
      HELIX: ANALYSIS_RUN
      ONEFINUX: WORKFLOW
    # Sample reference data. Production: effective-dated hierarchy tables owned by reference data.
    cross-references:
      - { from-type: MASTER_BOOK, from-id: MB001, to-type: COST_CENTRE, to-id: CC-4410 }
      - { from-type: MASTER_BOOK, from-id: MB002, to-type: COST_CENTRE, to-id: CC-4410 }
      - { from-type: MASTER_BOOK, from-id: MB003, to-type: COST_CENTRE, to-id: CC-4420 }
      - { from-type: BOOK_ID, from-id: BK-EQ, to-type: CHORUS_GROUP, to-id: CG-EQUITIES }
      - { from-type: BOOK_ID, from-id: BK-FI, to-type: CHORUS_GROUP, to-id: CG-RATES }
      - { from-type: COST_CENTRE, from-id: CC-4410, to-type: ACCOUNT, to-id: GL-100200 }

  # ---------------------------------------------------------------- Component 4: downstream actions
  action-targets:
    helix:
      url: http://localhost:7081/helix/analysis
    axiom:
      url: http://localhost:7081/axiom/reports/15c3

  # ---------------------------------------------------------------- Component 5: notifications
  notifications:
    milestones: [50, 90]
    log-channel-enabled: true
    webhook-url: ""        # e.g. a Teams Workflows webhook; empty = disabled

  # ---------------------------------------------------------------- Component 3: business outcomes
  # SLA: use "cutoff" + "day-offset" for real cut-offs (e.g. 07:30 on COB+1),
  # or "within-minutes" (from the first event) so the demo can show at-risk and breach alerts.
  outcomes:
    - id: FOBO_HELIX
      name: FOBO investigation
      question: Can I execute FOBO analysis?
      regions: [GLOBAL]
      owner-group: FOBO Controllers
      sla:
        within-minutes: 5
      dependencies:
        - event-type: MASTERBOOK_READY
          source-system: MOTIF
          expected-count: 300
          label: Master books
      on-ready:
        action: HTTP_COMMAND
        target: helix
        completion-event: HELIX_ANALYSIS_COMPLETE
        action-label: Helix analysis
      grids:
        - id: investigation
          title: Investigation
          endpoint: /sim/grids/investigation
          method: GET
          params:
            - name: cobDate
              from: cobDate
            - name: region
              from: region
            - name: groupUnitId
              from: groupUnitId
            - name: account
              from: account
            - name: journalId
              from: journalId
        - id: close
          title: Close and sign-off
          endpoint: /sim/grids/close
          method: GET
          params:
            - name: cobDate
              from: cobDate
            - name: region
              from: region
            - name: groupUnitId
              from: groupUnitId
            - name: status
              from: status

    - id: REPORT_15C3
      name: 15C3 report
      question: Can I produce the 15C3 report?
      regions: [AMRS]
      owner-group: US Regulatory Reporting
      sla:
        within-minutes: 5
        # cutoff: "07:30"
        # day-offset: 1
      dependencies:
        - event-type: SAP_TB_COMPLETE
          source-system: SAP
          expected-count: 5
          label: SAP trial balance
        - event-type: USCASTLE_COMPLETE
          source-system: USCASTLE
          expected-count: 5
          label: US Castle batches
        - event-type: FINSTORE_LOADED
          source-system: FINSTORE
          expected-count: 5
          label: Finance Store feeds
        - event-type: AXIOM_READY
          source-system: AXIOM
          expected-count: 5
          label: Axiom schedules
      on-ready:
        action: HTTP_COMMAND
        target: axiom
        completion-event: REG_REPORT_GENERATED
        action-label: 15C3 report generation

    - id: PNL_REPORTING
      name: PnL reporting
      question: Can I run PnL reporting?
      regions: [AMRS]
      owner-group: Product Control
      sla:
        within-minutes: 1
      dependencies:
        - event-type: GMIS_LOADED
          source-system: GMIS
          expected-count: 3
          label: GMIS books
        - event-type: RAMP_CHORUS_READY
          source-system: RAMP
          expected-count: 2
          label: RAMP chorus groups
        - event-type: SAP_TB_COMPLETE   # shared with 15C3: publish once, consumed by many outcomes
          source-system: SAP
          expected-count: 5
          label: SAP trial balance
      on-ready:
        action: NOTIFY_ONLY
