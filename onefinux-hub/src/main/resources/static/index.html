<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Finance UX – Outcome board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #E9EDF1;
    --surface: #FFFFFF;
    --ink: #13202D;
    --muted: #5A6776;
    --rule: #D3DAE1;
    --navy: #0B3558;
    --navy-soft: #1B4A73;
    --ready: #1B7A4A;
    --progress: #1F5FAE;
    --blocked: #B42318;
    --risk: #9A5B00;
    --idle: #8C96A3;
    --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font: 15px/1.5 var(--sans); font-variant-numeric: tabular-nums; }
  button, select, input { font: inherit; }
  :focus-visible { outline: 3px solid #6FA8DC; outline-offset: 2px; }

  /* ---------- header ---------- */
  header { background: var(--navy); color: #fff; padding: 18px 28px 16px; }
  .masthead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 24px; }
  .masthead h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .masthead p { margin: 0; color: #C5D5E6; font-size: 14px; }
  .live { display: inline-flex; align-items: center; gap: 7px; }
  .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #E0A33B; }
  .live.on::before { background: #5BD18F; }
  .demo { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
  .demo span { color: #C5D5E6; font-size: 13px; margin-right: 4px; }
  .demo button { background: transparent; color: #fff; border: 1px solid #5E86AC; border-radius: 4px; padding: 5px 11px; cursor: pointer; font-size: 13px; }
  .demo button:hover { background: var(--navy-soft); }
  .demo button.quiet { border-color: transparent; color: #C5D5E6; text-decoration: underline; }
  .demo-msg { width: 100%; font-size: 13px; color: #FFD9A0; min-height: 0; margin: 0; }

  /* ---------- layout ---------- */
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; padding: 24px 28px 40px; align-items: start; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; padding: 16px; } header { padding: 16px; } }

  /* ---------- outcome panels ---------- */
  .board { display: grid; gap: 18px; }
  .outcome { background: var(--surface); border-left: 5px solid var(--idle); border-radius: 2px 6px 6px 2px; padding: 20px 24px 18px; }
  .outcome[data-tone="progress"] { border-left-color: var(--progress); }
  .outcome[data-tone="ready"] { border-left-color: var(--ready); }
  .outcome[data-tone="blocked"] { border-left-color: var(--blocked); }
  .outcome[data-tone="risk"] { border-left-color: var(--risk); }
  .question { margin: 0; color: var(--muted); font-size: 15px; }
  .answer { margin: 2px 0 4px; font-size: 34px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em; color: var(--idle); }
  [data-tone="progress"] .answer { color: var(--progress); }
  [data-tone="ready"] .answer { color: var(--ready); }
  [data-tone="blocked"] .answer { color: var(--blocked); }
  [data-tone="risk"] .answer { color: var(--risk); }
  .detail { margin: 0 0 14px; max-width: 70ch; }
  .meter { height: 10px; background: #E3E8ED; border-radius: 5px; overflow: hidden; }
  .meter > span { display: block; height: 100%; width: 0; background: currentColor; transition: width .4s ease; }
  .outcome .meter { color: var(--idle); }
  [data-tone="progress"] .meter { color: var(--progress); }
  [data-tone="ready"] .meter { color: var(--ready); }
  [data-tone="blocked"] .meter { color: var(--blocked); }
  [data-tone="risk"] .meter { color: var(--risk); }
  .facts { display: flex; flex-wrap: wrap; gap: 4px 26px; margin: 12px 0 0; padding: 0; }
  .facts div { display: flex; flex-direction: column; }
  .facts dt { color: var(--muted); font-size: 12px; }
  .facts dd { margin: 0; font-weight: 500; }

  .deps { list-style: none; margin: 16px 0 0; padding: 12px 0 0; border-top: 1px solid var(--rule); display: grid; gap: 8px; }
  .dep { display: grid; grid-template-columns: minmax(150px, 220px) 1fr 64px; gap: 12px; align-items: center; font-size: 14px; }
  .dep small { color: var(--muted); display: block; font-size: 12px; }
  .dep .meter { height: 6px; color: var(--progress); }
  .dep.done .meter { color: var(--ready); }
  .dep.failed .meter { color: var(--blocked); }
  .dep .count { text-align: right; }
  .dep .note { grid-column: 1 / -1; color: var(--blocked); font-size: 13px; margin-top: -4px; }
  .dep .note.override { color: var(--risk); }
  @media (max-width: 560px) { .dep { grid-template-columns: 1fr 56px; } .dep .meter { grid-column: 1 / -1; grid-row: 2; } }

  /* the 300 master book grid: one cell per book */
  .books { display: grid; grid-template-columns: repeat(30, 1fr); gap: 2px; margin-top: 14px; max-width: 640px; }
  .books i { aspect-ratio: 1; background: #E3E8ED; border-radius: 1px; }
  .books i.in { background: var(--ready); }
  .books-caption { color: var(--muted); font-size: 12px; margin: 6px 0 0; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; align-items: flex-start; }
  .actions button, .override button { background: var(--surface); color: var(--navy); border: 1px solid var(--navy); border-radius: 4px; padding: 6px 12px; cursor: pointer; }
  .actions button:hover, .override button:hover { background: #EEF3F8; }
  details.override { font-size: 14px; }
  details.override summary { cursor: pointer; color: var(--navy); padding: 6px 0; }
  details.override form { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; margin-top: 6px; max-width: 560px; }
  details.override label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
  details.override label.wide { grid-column: 1 / -1; }
  details.override select, details.override input { border: 1px solid var(--rule); border-radius: 4px; padding: 6px 8px; color: var(--ink); background: #fff; }
  .form-msg { grid-column: 1 / -1; margin: 0; font-size: 13px; color: var(--blocked); }

  /* ---------- rail ---------- */
  aside { display: grid; gap: 18px; position: sticky; top: 16px; }
  @media (max-width: 1000px) { aside { position: static; } }
  .rail { background: var(--surface); border-radius: 6px; padding: 16px 18px; }
  .rail h2 { margin: 0 0 10px; font-size: 16px; font-weight: 600; }
  .rail .empty { color: var(--muted); font-size: 14px; margin: 0; }
  .inbox { list-style: none; margin: 0; padding: 0; max-height: 52vh; overflow-y: auto; }
  .inbox li { border-left: 3px solid var(--idle); padding: 8px 0 8px 12px; border-bottom: 1px solid #EEF1F4; }
  .inbox li[data-sev="SUCCESS"] { border-left-color: var(--ready); }
  .inbox li[data-sev="WARN"] { border-left-color: var(--risk); }
  .inbox li[data-sev="CRITICAL"] { border-left-color: var(--blocked); }
  .inbox li[data-sev="INFO"] { border-left-color: var(--progress); }
  .inbox strong { display: block; font-weight: 600; font-size: 14px; }
  .inbox p { margin: 2px 0; font-size: 13.5px; }
  .inbox small { color: var(--muted); font-size: 12px; }
  .inbox li.fresh { animation: arrive .9s ease-out; }
  @keyframes arrive { from { background: #FFF4D6; } to { background: transparent; } }

  .tape { list-style: none; margin: 0; padding: 0; max-height: 30vh; overflow-y: auto; font-size: 13px; }
  .tape li { display: grid; grid-template-columns: 54px 78px 1fr; gap: 8px; padding: 3px 0; border-bottom: 1px solid #F1F3F6; }
  .tape time { color: var(--muted); }
  .tape code { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
  .tape .st-FAILED, .tape .st-REVOKED { color: var(--blocked); }

  @media (prefers-reduced-motion: reduce) { .meter > span { transition: none; } .inbox li.fresh { animation: none; } }
</style>
</head>
<body>
<header>
  <div class="masthead">
    <h1>One Finance UX</h1>
    <p id="context">Loading business date</p>
    <p class="live" id="live" role="status">Connecting</p>
  </div>
  <div class="demo" aria-label="Demo controls">
    <span>Simulate sources:</span>
    <button type="button" data-sim="helix">Run Helix scenario</button>
    <button type="button" data-sim="15c3">Run 15C3 scenario</button>
    <button type="button" data-sim="15c3?failure=true">Run 15C3 with a failure</button>
    <button type="button" data-sim="pnl">Run PnL scenario</button>
    <button type="button" data-sim="restate">Restate SAP trial balance</button>
    <button type="button" class="quiet" id="reset">Reset demo</button>
    <p class="demo-msg" id="demo-msg" role="alert"></p>
  </div>
</header>

<main>
  <section class="board" id="board" aria-label="Business outcomes"></section>
  <aside>
    <section class="rail" aria-labelledby="inbox-h">
      <h2 id="inbox-h">Notifications</h2>
      <ul class="inbox" id="inbox" aria-live="polite"></ul>
      <p class="empty" id="inbox-empty">Nothing yet. Notifications appear when an outcome starts, slips, blocks or becomes ready.</p>
    </section>
    <section class="rail" aria-labelledby="tape-h">
      <h2 id="tape-h">Incoming events</h2>
      <ul class="tape" id="tape"></ul>
      <p class="empty" id="tape-empty">No events received today. Start a scenario above or POST to /api/events.</p>
    </section>
  </aside>
</main>

<script>
const state = { config: null, panels: new Map(), user: "demo.controller" };
const $ = (sel, root = document) => root.querySelector(sel);

function lateText(o, at) {
  if (!o.breached || !o.deadline || !at) return "";
  const mins = Math.round((new Date(at) - new Date(o.deadline)) / 60000);
  return mins < 1 ? " Missed the deadline by under a minute." : ` Missed the ${fmtTime(o.deadline)} deadline by ${mins} min.`;
}

function fmtTime(iso) {
  if (!iso) return "–";
  return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone: state.config?.zone });
}
function minutesFromNow(iso) {
  if (!iso) return null;
  return Math.round((new Date(iso) - Date.now()) / 60000);
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

/* ---------- the plain-language answer to each business question ---------- */
function answerFor(o) {
  const waiting = o.dependencies.filter(d => d.pending > 0).map(d => `${d.label} (${d.completed} of ${d.expected})`);
  const missingBooks = missingKeys(o);
  const eta = minutesFromNow(o.eta);
  const etaText = o.eta ? (eta < 0 ? `expected by ${fmtTime(o.eta)} and now running late` : eta === 0 ? "due any moment" : `about ${eta} min to go, ETA ${fmtTime(o.eta)}`) : "ETA once more inputs arrive";
  switch (o.status) {
    case "NOT_STARTED":
      return { tone: "idle", answer: "Not yet", detail: "No inputs have arrived for this business date." };
    case "IN_PROGRESS": {
      const tone = o.breached || o.atRisk ? "risk" : "progress";
      const slip = o.breached ? ` Deadline ${fmtTime(o.deadline)} has passed.` : o.atRisk ? ` At risk of missing the ${fmtTime(o.deadline)} deadline.` : "";
      const tail = missingBooks.length && missingBooks.length <= 8 ? ` Still missing ${missingBooks.join(", ")}.` : ` Waiting on ${waiting.join(", ")}.`;
      return { tone, answer: "Not yet", detail: `${o.percent}% there, ${etaText}.${slip}${tail}` };
    }
    case "BLOCKED": {
      const failed = o.dependencies.filter(d => d.failedKeys.length).map(d => `${d.label} ${d.failedKeys.join(", ")}`);
      return { tone: "blocked", answer: "Blocked", detail: `${failed.join("; ")} failed. ${o.ownerGroup} have been notified.` };
    }
    case "READY":
      const late = lateText(o, o.readyAt);
      return { tone: "ready", answer: "Yes", detail: (o.hasAction ? `All ${o.expected} inputs complete at ${fmtTime(o.readyAt)}. Starting ${o.actionLabel}.` : `All ${o.expected} inputs complete at ${fmtTime(o.readyAt)}. You can proceed.`) + late };
    case "ACTION_RUNNING":
      return { tone: "ready", answer: `Yes, ${o.actionLabel} is running`, detail: `All ${o.expected} inputs complete at ${fmtTime(o.readyAt)}. Run ${o.actionRunId} in progress.` };
    case "ACTION_FAILED":
      return { tone: "blocked", answer: `Ready, but ${o.actionLabel} failed`, detail: `${o.resultSummary || ""} Use re-run once the issue is fixed.` };
    case "COMPLETED":
      return { tone: "ready", answer: "Done", detail: `${o.resultSummary || ""} Finished at ${fmtTime(o.completedAt)}.` + lateText(o, o.completedAt) };
    default:
      return { tone: "idle", answer: o.status, detail: "" };
  }
}

/** For numbered keys (MB001..MB300) we can name exactly which items are missing. */
function missingKeys(o) {
  const dep = o.dependencies.find(d => d.expected >= 50);
  if (!dep || dep.pending === 0 || dep.overridden) return [];
  const have = new Set(dep.completedKeys.map(k => parseInt((k.match(/(\d+)$/) || [])[1], 10)));
  const prefix = (dep.completedKeys[0] || "MB001").replace(/\d+$/, "");
  const width = ((dep.completedKeys[0] || "MB001").match(/\d+$/) || ["000"])[0].length;
  const out = [];
  for (let i = 1; i <= dep.expected; i++) if (!have.has(i)) out.push(prefix + String(i).padStart(width, "0"));
  return out;
}

/* ---------- rendering ---------- */
function panelFor(o) {
  let panel = state.panels.get(o.key);
  if (panel) return panel;
  panel = document.createElement("article");
  panel.className = "outcome";
  panel.innerHTML = `
    <p class="question"></p>
    <h2 class="answer"></h2>
    <p class="detail"></p>
    <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span></span></div>
    <dl class="facts"></dl>
    <ul class="deps"></ul>
    <div class="books-wrap"></div>
    <div class="actions"></div>`;
  $("#board").appendChild(panel);
  state.panels.set(o.key, panel);
  return panel;
}

function renderOutcome(o) {
  const panel = panelFor(o);
  const a = answerFor(o);
  panel.dataset.tone = a.tone;
  panel.setAttribute("aria-label", `${o.name}, ${o.region}`);
  $(".question", panel).textContent = o.question;
  $(".answer", panel).textContent = a.answer;
  $(".detail", panel).textContent = a.detail;
  const meter = $(".meter", panel);
  meter.setAttribute("aria-valuenow", o.percent);
  meter.setAttribute("aria-label", `${o.name} ${o.percent}% complete`);
  $("span", meter).style.width = o.percent + "%";

  const facts = [
    ["Outcome", o.name], ["Scope", `${o.region}, ${o.cobDate}`], ["Complete", `${o.completed} of ${o.expected}`],
    ["Pending", o.pending], ["ETA", o.eta ? fmtTime(o.eta) : "–"], ["Deadline", o.deadline ? fmtTime(o.deadline) : "–"], ["Owner", o.ownerGroup]
  ];
  $(".facts", panel).innerHTML = facts.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("");

  $(".deps", panel).innerHTML = o.dependencies.map(d => {
    const pct = d.expected ? Math.round(d.completed * 100 / d.expected) : 100;
    const cls = d.failedKeys.length ? "failed" : d.pending === 0 ? "done" : "";
    const note = d.failedKeys.length ? `<span class="note">Failed: ${esc(d.failedKeys.join(", "))}</span>`
      : d.overridden ? `<span class="note override">Overridden by ${esc(d.overriddenBy)}: ${esc(d.overrideReason)}</span>` : "";
    return `<li class="dep ${cls}"><span>${esc(d.label)}<small>${esc(d.sourceSystem)} <code>${esc(d.eventType)}</code></small></span>
      <div class="meter"><span style="width:${pct}%"></span></div><span class="count">${d.completed}/${d.expected}</span>${note}</li>`;
  }).join("");

  renderBooks(panel, o);
  renderActions(panel, o);
}

function renderBooks(panel, o) {
  const wrap = $(".books-wrap", panel);
  const dep = o.dependencies.find(d => d.expected >= 50);
  if (!dep) { wrap.innerHTML = ""; return; }
  let grid = $(".books", wrap);
  if (!grid || grid.children.length !== dep.expected) {
    wrap.innerHTML = `<div class="books" role="img"></div><p class="books-caption">Each square is one ${esc(dep.label.toLowerCase().replace(/s$/, ""))}. Green means its ready event has arrived.</p>`;
    grid = $(".books", wrap);
    grid.innerHTML = "<i></i>".repeat(dep.expected);
  }
  const done = new Set(dep.completedKeys.map(k => parseInt((k.match(/(\d+)$/) || [])[1], 10)));
  [...grid.children].forEach((cell, i) => cell.classList.toggle("in", dep.overridden || done.has(i + 1)));
  grid.setAttribute("aria-label", `${dep.completed} of ${dep.expected} ${dep.label.toLowerCase()} ready`);
}

function renderActions(panel, o) {
  const box = $(".actions", panel);
  const canRerun = o.hasAction && ["READY", "COMPLETED", "ACTION_FAILED"].includes(o.status);
  const open = o.dependencies.filter(d => d.pending > 0 || d.failedKeys.length);
  const sig = `${o.status}|${canRerun}|${open.map(d => d.eventType).join(",")}`;
  if (box.dataset.sig === sig) return;          // keep focus and half-typed reasons intact
  box.dataset.sig = sig;
  box.innerHTML = "";
  if (canRerun) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = `Re-run ${o.actionLabel}`;
    b.onclick = () => post(`/api/outcomes/${o.outcomeId}/${o.cobDate}/${o.region}/run`, { requestedBy: state.user });
    box.appendChild(b);
  }
  if (open.length && o.status !== "NOT_STARTED") {
    const d = document.createElement("details");
    d.className = "override";
    d.innerHTML = `<summary>Override an input</summary>
      <form>
        <label>Input<select name="dependency">${open.map(x => `<option value="${esc(x.eventType)}">${esc(x.label)}</option>`).join("")}</select></label>
        <label>Your name<input name="requestedBy" value="${esc(state.user)}" required></label>
        <label class="wide">Reason (recorded in the audit trail)<input name="reason" required placeholder="e.g. Batch confirmed complete by US Castle support, INC0123"></label>
        <button type="submit">Apply override</button>
        <p class="form-msg" role="alert"></p>
      </form>`;
    $("form", d).onsubmit = async ev => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      const msg = $(".form-msg", d);
      const r = await post(`/api/outcomes/${o.outcomeId}/${o.cobDate}/${o.region}/override`, Object.fromEntries(f));
      msg.textContent = r.ok ? "" : r.error;
    };
    box.appendChild(d);
  }
}

function addNotification(n, fresh) {
  $("#inbox-empty").hidden = true;
  const li = document.createElement("li");
  li.dataset.sev = n.severity;
  if (fresh) li.className = "fresh";
  li.innerHTML = `<strong>${esc(n.title)}</strong><p>${esc(n.message)}</p><small>${fmtTime(n.createdAt)} to ${esc(n.audience)} via ${esc(n.channels)}</small>`;
  const inbox = $("#inbox");
  fresh ? inbox.prepend(li) : inbox.appendChild(li);
  while (inbox.children.length > 80) inbox.lastChild.remove();
}

function addEvent(e, fresh) {
  $("#tape-empty").hidden = true;
  const li = document.createElement("li");
  li.innerHTML = `<time>${fmtTime(e.receivedAt)}</time><span>${esc(e.sourceSystem)}</span><span><code>${esc(e.eventType)}</code> ${esc(e.sourceKey)} <span class="st-${esc(e.status)}">${e.status === "COMPLETED" ? "" : esc(e.status.toLowerCase())}</span></span>`;
  const tape = $("#tape");
  fresh ? tape.prepend(li) : tape.appendChild(li);
  while (tape.children.length > 60) tape.lastChild.remove();
}

/* ---------- data ---------- */
async function post(url, body) {
  try {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
    if (r.ok) return { ok: true };
    const p = await r.json().catch(() => ({}));
    return { ok: false, error: p.detail || `Request failed with ${r.status}` };
  } catch (e) { return { ok: false, error: "The hub is not reachable." }; }
}

async function loadAll() {
  const [outcomes, notes, events] = await Promise.all(["/api/outcomes", "/api/notifications?limit=60", "/api/events?limit=60"]
    .map(u => fetch(u).then(r => r.json())));
  $("#board").innerHTML = ""; state.panels.clear();
  $("#inbox").innerHTML = ""; $("#tape").innerHTML = "";
  $("#inbox-empty").hidden = notes.length > 0; $("#tape-empty").hidden = events.length > 0;
  outcomes.forEach(renderOutcome);
  notes.forEach(n => addNotification(n, false));
  events.forEach(e => addEvent(e, false));
}

function connect() {
  const es = new EventSource("/api/stream");
  const live = $("#live");
  es.onopen = () => { live.textContent = "Live"; live.classList.add("on"); };
  es.onerror = () => { live.textContent = "Reconnecting"; live.classList.remove("on"); };
  es.addEventListener("outcome", m => renderOutcome(JSON.parse(m.data)));
  es.addEventListener("notification", m => addNotification(JSON.parse(m.data), true));
  es.addEventListener("event", m => addEvent(JSON.parse(m.data), true));
  es.addEventListener("reset", () => loadAll());
}

document.querySelectorAll("[data-sim]").forEach(b => b.addEventListener("click", async () => {
  const msg = $("#demo-msg");
  msg.textContent = "";
  try {
    const r = await fetch(`${state.config.simulatorUrl}/sim/scenarios/${b.dataset.sim}`, { method: "POST" });
    if (!r.ok) throw new Error(r.status);
  } catch (e) {
    msg.textContent = `The source simulator is not reachable at ${state.config.simulatorUrl}. Start it with: cd source-simulator && mvn spring-boot:run`;
  }
}));
$("#reset").addEventListener("click", async () => {
  try { await fetch(`${state.config.simulatorUrl}/sim/scenarios/cancel`, { method: "POST" }); } catch (e) { /* simulator optional */ }
  await post("/api/admin/reset");
});

(async function init() {
  state.config = await fetch("/api/config").then(r => r.json());
  const date = new Date(state.config.businessDate + "T12:00:00").toLocaleDateString([], { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  $("#context").textContent = `Business date ${date}`;
  await loadAll();
  connect();
})();
</script>
</body>
</html>
