name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub-and-simulator:
    name: Build & test (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: CORS origins are an exact allowlist
        run: python3 scripts/check_cors.py
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.xml"
          if-no-files-found: ignore

  web:
    name: Build (Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - name: Unit tests (workspace, FDC3 channels, themes, finance, live link)
        run: npm test
      - run: npm run build
      - name: BrandMark unique SVG ids
        working-directory: .
        run: python3 scripts/check_brand_mark.py
      - name: Desktop alerts stay outside the browser
        working-directory: .
        run: python3 scripts/check_notify_card.py
      - name: Confirm IIS web.config landed in dist
        run: test -f dist/web.config
      - name: Shared design standard served at /theme for framed apps
        run: test -f dist/theme/onefinux-tokens.css && test -f dist/theme/onefinux-wijmo.css
      - name: Grid library served at /lib for other apps (<ofx-grid>)
        run: test -f dist/lib/onefinux-grid.js && test -f dist/lib/onefinux-grid.css

  e2e:
    name: End-to-end and accessibility (browser)
    runs-on: ubuntu-latest
    needs: [hub-and-simulator, web]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Build the hub and simulator
        run: mvn -B -q package -DskipTests
      - name: Start the hub and simulator
        run: |
          mkdir -p logs
          nohup java -jar onefinux-hub/target/onefinux-hub-0.1.0-SNAPSHOT.jar > logs/hub.log 2>&1 &
          nohup java -jar source-simulator/target/source-simulator-0.1.0-SNAPSHOT.jar > logs/sim.log 2>&1 &
          timeout 240 bash -c 'until curl -sf localhost:7070/actuator/health/readiness >/dev/null && curl -sf localhost:7081/sim/grids/breaks >/dev/null; do sleep 3; done'
      - name: Install console dependencies and the browser
        working-directory: frontend/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Journeys (search, assistant, write-back, roles, feedback, desks) and WCAG 2.1 AA checks
        working-directory: frontend/web
        env:
          CI: "true"
        run: npm run e2e
      - name: Keep the report and service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/web/e2e-report
            frontend/web/test-results
            logs
          if-no-files-found: ignore

  windows-host-files:
    name: Windows IIS + NSSM host files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows host enablement
        run: python3 scripts/check_windows_host.py
      - name: CORS origins are an exact allowlist
        run: python3 scripts/check_cors.py
