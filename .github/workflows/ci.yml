name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub-and-simulator:
    name: Build & test (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.xml"
          if-no-files-found: ignore

  web:
    name: Build (Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: BrandMark unique SVG ids
        working-directory: .
        run: python3 scripts/check_brand_mark.py
      - name: Notification cards have a dismiss X
        working-directory: .
        run: python3 scripts/check_notify_card.py
      - name: Confirm IIS web.config landed in dist
        run: test -f dist/web.config

  windows-host-files:
    name: Windows IIS + NSSM host files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows host enablement
        run: python3 scripts/check_windows_host.py
