server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Security headers. The console frames partner and STEPS screens (frame-src), talks only to its own origin
  # (connect-src, WebSocket included), and may itself be framed only by itself. /widget/ and /lib/ are the
  # embeddable grid other teams' apps load, so they allow any ancestor; they never show edit or approve controls
  # when framed by another site. Behind TLS, also send Strict-Transport-Security (see the 443 block below).
  set $ofx_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' https: http:; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'";
  add_header Content-Security-Policy "$ofx_csp; frame-ancestors 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

  # SPA history fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Embeddable grid (iframe /widget/grid and the <ofx-grid> bundle): any app may frame or load it.
  location /widget/ {
    add_header Content-Security-Policy "$ofx_csp; frame-ancestors *" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri /index.html;
  }
  location /lib/ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # WebSocket live channel (same events as SSE). Upgrade headers turn the hop into a socket.
  location = /api/ws {
    proxy_pass http://hub:7070;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  # REST + Server-Sent Events to the hub. proxy_buffering off keeps the SSE stream live.
  location /api/ {
    proxy_pass http://hub:7070;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # Scenario drivers + downstream sink on the simulator.
  location /sim/ {
    proxy_pass http://simulator:7081;
    proxy_http_version 1.1;
    proxy_buffering off;
  }
}

