server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA history fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # REST + Server-Sent Events to the hub. proxy_buffering off keeps the SSE stream live.
  location /api/ {
    proxy_pass http://hub:7070;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # Scenario drivers + downstream sink on the simulator.
  location /sim/ {
    proxy_pass http://simulator:7081;
    proxy_http_version 1.1;
    proxy_buffering off;
  }
}
